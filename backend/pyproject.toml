[project]
name = "geominer-backend"
version = "1.2.0"
description = "Cloud-Based Remote Sensing Prospectivity and Mineral Exploration Targeting Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "earthengine-api>=0.1.350",
    "google-auth>=2.20.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "httpx>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
