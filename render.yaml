services:
  - type: web
    name: geominer-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEE_PROJECT
        sync: false
      - key: GEE_SERVICE_ACCOUNT
        sync: false
      - key: GEE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
